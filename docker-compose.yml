services:
  # Ansible on Debian 13
  # docker compose run --rm debian13 [args ...]
  debian13:
    image: serverconfig:debian13
    build:
      context: .
      args:
        BASE_IMAGE: debian:13
    hostname: localhost
    volumes:
      - '.:/serverconfig'

  # Ansible on openSUSE Leap 16.0
  # docker compose run --rm opensuse160 [args ...]
  opensuse160:
    image: serverconfig:opensuse160
    build:
      context: .
      args:
        BASE_IMAGE: opensuse/leap:16.0
    hostname: localhost
    volumes:
      - '.:/serverconfig'

  # Ansible on openSUSE Tumbleweed
  # docker compose run --rm opensusetw [args ...]
  opensusetw:
    image: serverconfig:opensusetw
    build:
      context: .
      args:
        BASE_IMAGE: opensuse/tumbleweed:latest
    hostname: localhost
    volumes:
      - '.:/serverconfig'

  # Ansible on Rocky Linux 9
  # docker compose run --rm rocky9 [args ...]
  rocky9:
    image: serverconfig:rocky9
    build:
      context: .
      args:
        BASE_IMAGE: rockylinux:9
    hostname: localhost
    volumes:
      - '.:/serverconfig'

  # Ansible on Ubuntu 26.04
  # docker compose run --rm ubuntu2604 [args ...]
  ubuntu2604:
    image: serverconfig:ubuntu2604
    build:
      context: .
      args:
        BASE_IMAGE: ubuntu:26.04
    hostname: localhost
    volumes:
      - '.:/serverconfig'
